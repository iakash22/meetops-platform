name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (Dependabot github-actions keeps them current).
# pnpm comes from package.json "packageManager" via corepack.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable corepack for setup-node's Node
        run: corepack enable && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lockfile unchanged
        run: git diff --exit-code pnpm-lock.yaml

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable && pnpm --version

      # Reads pnpm-lock.yaml only; flags high/critical advisories in production deps.
      # TEMPORARY EXCEPTION (expires 2026-11-04): non-blocking only because every
      # current high advisory is in fastify 4.x (apps/api) and needs fastify >= 5.12.2.
      # As soon as the Fastify 5 upgrade lands (or on 2026-11-04, whichever is first),
      # delete continue-on-error so this fails on high/critical.
      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
