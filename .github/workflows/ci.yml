name: CI

on:
  push:
    branches: [main, 'integration/**']
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.editorconfig']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.editorconfig']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (Dependabot github-actions keeps them current).

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Coordinator decision (docs/00-getting-started/windows-setup.md): build on Node 22 and 24; live-db stays on 20.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    # Throwaway, CI-only credentials for ephemeral containers. Not secrets; never reuse outside CI.
    services:
      postgres:
        # pgvector/pgvector:pg16 (PostgreSQL 16 + pgvector, same as infra/compose), pinned by index digest.
        image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: meetops
          POSTGRES_PASSWORD: ci-throwaway-postgres
          POSTGRES_DB: meetops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meetops -d meetops_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      # Superuser URL is step-scoped to db:roles only; tests and apps get the non-superuser meetops_app (RLS enforced).
      MEETOPS_DB_NAME: meetops_test
      MEETOPS_APP_DB_PASSWORD: ci-only-throwaway-app
      MEETOPS_MIGRATOR_DB_PASSWORD: ci-only-throwaway-migrator
      DATABASE_URL: postgresql://meetops_app:ci-only-throwaway-app@localhost:5432/meetops_test
      # Names used by packages/storage (loadStorageConfig) and .env.example.
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: meetops-ci
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: 'true'
      # Generic S3_* aliases (same values) for tooling that expects them.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: meetops-ci
      S3_FORCE_PATH_STYLE: 'true'
      # Pinned MinIO image. minio/minio was removed from Docker Hub and quay.io now needs auth,
      # so use Chainguard's public build (cgr.dev/chainguard/minio:latest), pinned by index digest.
      MINIO_IMAGE: cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MinIO needs a `server /data` command, which `services:` cannot pass, so start it here
      # with a Docker health check plus an HTTP readiness wait.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$STORAGE_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$STORAGE_SECRET_ACCESS_KEY" \
            --tmpfs /data:uid=65532,gid=65532 \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null; then echo "MinIO ready"; exit 0; fi
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Create bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ env.STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.STORAGE_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          aws --endpoint-url "$STORAGE_ENDPOINT" s3api create-bucket --bucket "$STORAGE_BUCKET" \
            || aws --endpoint-url "$STORAGE_ENDPOINT" s3api head-bucket --bucket "$STORAGE_BUCKET"
          aws --endpoint-url "$STORAGE_ENDPOINT" s3api head-bucket --bucket "$STORAGE_BUCKET"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lockfile unchanged
        run: git diff --exit-code pnpm-lock.yaml

      - name: Assert type-aware lint config
        # Fast mode (ESLINT_NO_TYPECHECK=1) is for the pre-commit hook only.
        run: |
          test -z "${ESLINT_NO_TYPECHECK:-}" || { echo "ESLINT_NO_TYPECHECK must be unset in CI"; exit 1; }
          pnpm exec eslint --print-config apps/api/src/server.ts | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8")).rules;
            for (const k of ["@typescript-eslint/no-floating-promises", "@typescript-eslint/no-misused-promises"]) {
              const v = [].concat(r[k] ?? [0])[0];
              if (v !== 2 && v !== "error") { console.error(k + " not active: " + JSON.stringify(r[k])); process.exit(1); }
            }
            console.log("type-aware promise rules active");'

      - name: Create DB roles (meetops_app / meetops_migrator)
        run: pnpm --filter @meetops/database db:roles
        env:
          ADMIN_DATABASE_URL: postgresql://meetops:ci-throwaway-postgres@localhost:5432/meetops_test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Cap turbo parallelism in CI to reduce timing flakes on shared runners.
        run: pnpm exec turbo run test --concurrency=2

      - name: Build
        run: pnpm build

      - name: Bundle budget (web)
        # Reuses the build above (turbo cache); fails on a gzip budget breach. See docs/05-web/performance.md.
        run: pnpm size

      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio || true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Blocking: fails on high/critical; exceptions are dated entries in scripts/audit-gate.mjs.
      - name: Audit gate
        run: node scripts/audit-gate.mjs

  # Live Postgres checks for packages/database (see packages/database/docs/ci-live-db.example.yml).
  live-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: meetops
          POSTGRES_PASSWORD: ci-throwaway-postgres
          POSTGRES_DB: meetops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meetops -d meetops_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    # Throwaway, CI-only values for an ephemeral database. Not secrets; never reuse outside CI.
    env:
      # Superuser URLs are step-scoped: ADMIN_DATABASE_URL on db:roles, RLS_TEST_ADMIN_URL on test:live.
      MEETOPS_DB_NAME: meetops_test
      MEETOPS_APP_DB_PASSWORD: ci-only-throwaway-app
      MEETOPS_MIGRATOR_DB_PASSWORD: ci-only-throwaway-migrator
      MEETOPS_RELAY_DB_PASSWORD: ci-only-throwaway-relay
      MIGRATION_DATABASE_URL: postgresql://meetops_migrator:ci-only-throwaway-migrator@localhost:5432/meetops_test
      RLS_TEST_OWNER_URL: postgresql://meetops_migrator:ci-only-throwaway-migrator@localhost:5432/meetops_test
      DATABASE_URL: postgresql://meetops_app:ci-only-throwaway-app@localhost:5432/meetops_test
      RLS_TEST_APP_URL: postgresql://meetops_app:ci-only-throwaway-app@localhost:5432/meetops_test
      RLS_TEST_RELAY_URL: postgresql://meetops_relay:ci-only-throwaway-relay@localhost:5432/meetops_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'pnpm'

      # The root postinstall runs turbo across every workspace (e.g. apps/extension), which fails when
      # only @meetops/database and its deps are installed, so skip lifecycle scripts and generate explicitly.
      - name: Install dependencies
        run: pnpm --filter @meetops/database install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm --filter @meetops/database exec prisma generate

      - name: Create DB roles
        run: pnpm --filter @meetops/database db:roles
        env:
          ADMIN_DATABASE_URL: postgresql://meetops:ci-throwaway-postgres@localhost:5432/meetops_test

      - name: Migrate
        run: pnpm --filter @meetops/database db:migrate:deploy

      - name: Drift check
        run: >-
          pnpm --filter @meetops/database exec prisma migrate diff
          --from-url "$MIGRATION_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Seed (twice, must be idempotent)
        run: |
          pnpm --filter @meetops/database db:seed
          pnpm --filter @meetops/database db:seed

      - name: Live tests
        run: pnpm --filter @meetops/database test:live
        env:
          RLS_TEST_ADMIN_URL: postgresql://meetops:ci-throwaway-postgres@localhost:5432/meetops_test
# hook-verified commit
# hook-verified commit (husky active)
