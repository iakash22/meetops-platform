# QA suites in tests/ (spec: tests/ci/ci-jobs-spec.md, PR #29).
# tests/ is a pnpm workspace member (@meetops/tests): the single root install covers it.
name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check: Testcontainers starts its own Postgres (pgvector) and Redis containers.
  qa-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    permissions:
      contents: read
    env:
      QA_POSTGRES_IMAGE: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
      QA_REDIS_IMAGE: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
      TESTCONTAINERS_RYUK_DISABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies of tests/
        # Suites import @meetops/* packages through their built dist entries.
        run: pnpm exec turbo run build --filter=@meetops/tests^...

      - name: Pre-pull container images
        run: |
          docker pull "$QA_POSTGRES_IMAGE"
          docker pull "$QA_REDIS_IMAGE"

      - name: Lint and typecheck tests/
        working-directory: tests
        run: |
          pnpm lint
          pnpm typecheck

      - name: Unit, contract, security and API suites
        working-directory: tests
        run: pnpm test:unit

      - name: Integration suites (Testcontainers)
        working-directory: tests
        run: pnpm test:integration

  # Informational until apps/web has real pages: failures do not fail the workflow.
  qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    continue-on-error: true
    permissions:
      contents: read
    env:
      WEB_PORT: 5173
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw
        working-directory: tests
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-node${{ matrix.node }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium (with OS deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E (starts apps/web dev server)
        working-directory: tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-node${{ matrix.node }}
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 14
          if-no-files-found: warn
