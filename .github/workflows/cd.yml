name: CD

# PROPOSAL: GitHub Actions minutes are exhausted, so this workflow is inert by default.
# Every job is gated on the repository variable CD_ENABLED == 'true' (Settings -> Variables).
# Until it is set, pushes create only skipped jobs (no runner minutes). Local gates remain CI.

on:
  push:
    branches: [main, 'integration/phase-1']
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.editorconfig']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Image tag to deploy (commit SHA or branch tag); defaults to the triggering SHA
        required: false
        type: string
      publish:
        description: Also build and push images from the selected ref before deploying
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.image }} image
    if: vars.CD_ENABLED == 'true' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web, realtime]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}/${{ matrix.image }}
          # sha-<full sha> and a sanitized branch tag (integration/phase-1 -> integration-phase-1)
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: publish
    if: >-
      always() && vars.CD_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protection rules (required reviewers, branch restrictions) are configured on the
    # GitHub environments "staging" and "production" in repo settings.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${INPUT_TAG:-sha-${GITHUB_SHA}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Placeholder deploy (no infrastructure yet)
        env:
          TARGET_ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "PLACEHOLDER: no deploy target exists yet. Nothing is deployed."
          echo "Would deploy ghcr.io/${GITHUB_REPOSITORY,,}/{api,worker,web,realtime}:${IMAGE_TAG} to ${TARGET_ENV}."
          echo "When real infrastructure exists, define these as *environment* secrets on '${TARGET_ENV}':"
          echo "  DEPLOY_HOST / DEPLOY_TARGET  - deploy endpoint (cluster API, host, or platform app id)"
          echo "  DEPLOY_CREDENTIALS           - deploy credential (prefer OIDC federation over static keys)"
          echo "  DATABASE_URL                 - for running prisma migrate deploy before rollout"
          echo "  plus app runtime config (Redis URL, storage, email, AI provider keys) held by the platform, not CI"
