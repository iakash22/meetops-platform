name: Secret scan

# BLOCKING secret control (private repo on the free plan: no GitHub push
# protection). Runs on every PR event and base-branch push; no path filters,
# no `if:`, no continue-on-error, so any finding fails the run.
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tgz}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tgz}\$" | sha256sum -c -
          sudo tar xzf "${tgz}" -C /usr/local/bin gitleaks
          gitleaks version

      # Runs on every pull_request (and push to main); gitleaks version pinned above.
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --no-banner --log-opts="--all" --exit-code 1
