name: Secret scan

# BLOCKING secret control (private repo on the free plan: no GitHub push
# protection). Runs on every PR event and base-branch push; no path filters,
# no `if:`, no continue-on-error, so any finding fails the run.
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tgz}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tgz}\$" | sha256sum -c -
          sudo tar xzf "${tgz}" -C /usr/local/bin gitleaks
          gitleaks version

      # Full history of the checked-out ref only (HEAD = PR merge commit). Without
      # --log-opts gitleaks 8 scans `git log --all`, i.e. every fetched branch.
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --no-banner --log-opts="HEAD" --exit-code 1
