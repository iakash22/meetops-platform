# freshclam for the upload scan sidecar (ADR-018, MAL-1). Mounted read-only at
# /etc/clamav/freshclam.conf. The image's /init runs `freshclam --daemon
# --checks=$FRESHCLAM_CHECKS`, and compose sets FRESHCLAM_CHECKS=1, so
# signatures update daily. Checks is set here too so the same file works if
# /init changes.
UpdateLogFile /var/log/clamav/freshclam.log
LogTime yes
DatabaseOwner clamav
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Number of database checks per day.
Checks 1
# Ask clamd to reload after an update (ConcurrentDatabaseReload keeps scans running).
NotifyClamd /etc/clamav/clamd.conf
