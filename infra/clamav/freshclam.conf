# freshclam for the upload scan sidecar (ADR-018, MAL-1, MAL-1b). Mounted
# read-only at /etc/clamav/freshclam.conf in the clamav-freshclam service only.
# compose runs `freshclam --daemon --foreground --stdout --checks=1` as the
# clamav user, so signatures update daily. Checks is set here too so the file
# says the same. No UpdateLogFile: logs go to stdout (docker logs).
LogTime yes
DatabaseOwner clamav
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Number of database checks per day.
Checks 1
# No NotifyClamd: freshclam is not on clamav-internal and cannot reach clamd.
# clamd reloads the new database itself (SelfCheck in clamd.conf).
