# clamd for the upload scan sidecar (ADR-018, MAL-1). Mounted read-only at
# /etc/clamav/clamd.conf in the pinned clamav/clamav image (see
# infra/compose/compose.app.yml and docs/13-ops/containers-and-ci.md).
#
# Size limits: clamd's "M" suffix is MiB, so 1400M = 1_468_006_400 bytes. That
# is above contracts MAX_MEDIA_BYTES (1_400_000_000) and below ClamAV's 2 GB
# ceiling. MAX_MEDIA_BYTES must stay <= these limits, or full-size uploads hit
# the limit instead of being scanned. apps/worker/test/clamd-config.test.ts
# enforces this.

# Logging and sockets. clamdscan uses /tmp/clamd.sock, and the image
# healthcheck (clamdcheck.sh) PINGs TCP 3310, so keep both.
# No LogFile: clamd runs in the foreground and logs to stdout (docker logs).
LogTime yes
LogClean no
ExtendedDetectionInfo yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav

# Largest INSTREAM body clamd accepts. A larger stream gets
# "INSTREAM size limit exceeded. ERROR".
StreamMaxLength 1400M
# Largest file that is scanned, and most data scanned per file (archives and
# containers included).
MaxFileSize 1400M
MaxScanSize 1400M
# Report a file that hits MaxFileSize, MaxScanSize, MaxScanTime or another
# limit as Heuristics.Limits.Exceeded.* FOUND instead of a partly-scanned OK.
# Fail-closed (ADR-018). The worker quarantines such a reply with its own code,
# scan_limit_exceeded, separate from malware_detected (MAL-2).
AlertExceedsMax yes
# The default 120 s can trip on a 1.4 GB file under load, and with
# AlertExceedsMax that becomes a Heuristics.Limits.Exceeded.MaxScanTime alert.
# 10 min, in ms. Must equal CLAMD_MAX_SCAN_TIME_MS in apps/worker/src/media/clamd.ts:
# the worker's total scan timeout is this plus 30 s, so clamd always answers
# (Limits.Exceeded.MaxScanTime at worst) before the worker gives up.
MaxScanTime 600000

# Keep serving scans while a signature reload runs (the default). The old and
# new engines are both in memory for a short time, so the container gets
# mem_limit 4g (ADR-018). We did not choose "ConcurrentDatabaseReload no":
# it blocks scans and PING for the whole reload, so in-flight 1.4 GB scans
# would stall and the planned worker /ready probe (MAL-2) would flap during every
# freshclam update.
ConcurrentDatabaseReload yes
# How often clamd checks for a newer database (s). freshclam runs in its own
# container (clamav-freshclam, MAL-1b) with no route to clamd, so it cannot send
# RELOAD; this check is how clamd picks up the daily update (within an hour).
SelfCheck 3600

# Scan threads: equals the worker's MEDIA_WORKER_CONCURRENCY (compose.app.yml),
# the only client. Together with the size-capped /tmp tmpfs this bounds temp
# disk use: each thread spools at most one 1400M stream plus 1400M extracted.
MaxThreads 1
# Connections waiting for a free thread; the worker never opens more than
# MaxThreads, so keep the backlog small.
MaxConnectionQueueLength 4
# INSTREAM spools to, and archive extraction writes into, this directory. It is
# a size-capped tmpfs in compose (root filesystem is read-only), so a hostile
# upload can fill only that tmpfs, never the host disk.
TemporaryDirectory /tmp

# Recursion and container limits, pinned to the ClamAV 1.4 defaults so an image
# bump cannot silently change them. A hit is Heuristics.Limits.Exceeded.*.
MaxRecursion 17
MaxFiles 10000
MaxEmbeddedPE 40M
PCREMaxFileSize 100M
