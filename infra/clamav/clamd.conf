# clamd for the upload scan sidecar (ADR-018, MAL-1). Mounted read-only at
# /etc/clamav/clamd.conf in the pinned clamav/clamav image (see
# infra/compose/compose.app.yml and docs/13-ops/containers-and-ci.md).
#
# Size limits: clamd's "M" suffix is MiB, so 1400M = 1_468_006_400 bytes. That
# is above contracts MAX_MEDIA_BYTES (1_400_000_000) and below ClamAV's 2 GB
# ceiling. MAX_MEDIA_BYTES must stay <= these limits, or full-size uploads hit
# the limit instead of being scanned. apps/worker/test/clamd-config.test.ts
# enforces this.

# Logging and sockets. The image's /init waits for /tmp/clamd.sock, and its
# healthcheck (clamdcheck.sh) PINGs TCP 3310, so keep both.
LogFile /var/log/clamav/clamd.log
LogTime yes
LogClean no
ExtendedDetectionInfo yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav

# Largest INSTREAM body clamd accepts. A larger stream gets
# "INSTREAM size limit exceeded. ERROR".
StreamMaxLength 1400M
# Largest file that is scanned, and most data scanned per file (archives and
# containers included).
MaxFileSize 1400M
MaxScanSize 1400M
# Report a file that hits MaxFileSize, MaxScanSize, MaxScanTime or another
# limit as Heuristics.Limits.Exceeded.* FOUND instead of a partly-scanned OK.
# Fail-closed (ADR-018). TODAY the worker treats such a reply like any other
# FOUND: the upload is quarantined as malware_detected. MAL-2 gives limit hits
# their own error code and metric, separate from infected.
AlertExceedsMax yes
# The default 120 s can trip on a 1.4 GB file under load, and with
# AlertExceedsMax that becomes a Heuristics.Limits.Exceeded.MaxScanTime alert.
# 10 min, in ms. TODAY the worker client has one fixed 120 s total timeout, so
# a scan slower than 120 s is abandoned by the worker (ClamdError: the job
# retries, and the last attempt quarantines as scan_unavailable) while clamd
# keeps scanning. MAL-2 replaces it with a size-aware timeout above this value.
MaxScanTime 600000

# Keep serving scans while a signature reload runs (the default). The old and
# new engines are both in memory for a short time, so the container gets
# mem_limit 4g (ADR-018). We did not choose "ConcurrentDatabaseReload no":
# it blocks scans and PING for the whole reload, so in-flight 1.4 GB scans
# would stall and the planned worker /ready probe (MAL-2) would flap during every
# freshclam update.
ConcurrentDatabaseReload yes
# How often clamd checks for a newer database (s). freshclam also notifies it.
SelfCheck 3600
