# MeetOps AI — application containers on top of the dev infra stack. DEV ONLY:
# this is a local integration harness, not a production deployment manifest.
# NOT standalone: it must be merged with compose.dev.yml, which defines postgres,
# redis, minio(-init) and the optional `ollama` / `local-stt` profile services
# referenced below (OLLAMA_BASE_URL / LOCAL_STT_URL). Use the helper:
#   scripts/compose-up.sh                      # dev infra + apps
#   scripts/compose-up.sh --profile ollama --profile local-stt --profile realtime
# which runs: docker compose --env-file .env -f infra/compose/compose.dev.yml -f infra/compose/compose.app.yml ... up -d --build
# Inside the compose network the apps reach infra by service name, so the
# localhost URLs from .env are overridden below. NODE_ENV comes from .env.
# Required credentials use ${VAR:?} (no fallbacks). Host ports bind to 127.0.0.1.

# Database roles (PR #25 RLS): api/worker connect as meetops_app (NOSUPERUSER,
# NOBYPASSRLS); only `migrate` uses meetops_migrator. Never the postgres superuser.
# Passwords are NOT interpolated here: compose `secrets:` (see compose.dev.yml)
# are mounted at /run/secrets and infra/compose/bin/with-secrets.sh builds
# DATABASE_URL / MIGRATION_DATABASE_URL / REDIS_URL / STORAGE_SECRET_ACCESS_KEY
# at container start (DB_ROLE=app|migrator|none). The URL values from .env are
# overridden/blanked so host-dev credentials never reach the containers.
x-secrets-shim: &secrets-shim ./bin/with-secrets.sh:/opt/with-secrets.sh:ro

x-infra-urls: &infra-urls
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
  DB_ROLE: app
  DATABASE_URL: ''
  MIGRATION_DATABASE_URL: ''
  REDIS_URL: ''
  STORAGE_SECRET_ACCESS_KEY: ''
  # Scoped MinIO user created by minio-init (bucket-only policy), never root.
  STORAGE_ACCESS_KEY_ID: ${STORAGE_APP_ACCESS_KEY_ID:-meetops-app}
  # .env password inputs (used only by scripts/gen-dev-secrets.sh --from-env) are blanked.
  POSTGRES_PASSWORD: ''
  MEETOPS_APP_DB_PASSWORD: ''
  MEETOPS_MIGRATOR_DB_PASSWORD: ''
  REDIS_PASSWORD: ''
  STORAGE_ENDPOINT: http://minio:9000
  OLLAMA_BASE_URL: http://ollama:11434
  LOCAL_STT_URL: http://local-stt:8000

services:
  # One-shot: prisma migrate deploy + seed (@meetops/database db:migrate:deploy, db:seed).
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: migrate
    image: meetops/migrate:local
    restart: 'no'
    env_file:
      - path: ../../.env
        required: true
    environment:
      <<: *infra-urls
      # Migrate + seed as the schema owner (RLS would hide/deny cross-tenant seed rows).
      DB_ROLE: migrator
    secrets: [meetops_migrator_db_password]
    volumes: [*secrets-shim]
    entrypoint: ['/bin/sh', '/opt/with-secrets.sh']
    command:
      [
        'sh',
        '-c',
        'pnpm --filter @meetops/database run db:migrate:deploy && pnpm --filter @meetops/database run db:seed',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: meetops/api:local
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: true
    environment: *infra-urls
    secrets: [meetops_app_db_password, redis_password, minio_app_password]
    volumes: [*secrets-shim]
    entrypoint: ['/bin/sh', '/opt/with-secrets.sh']
    command: ['node', 'dist/index.js']
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    image: meetops/worker:local
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: true
    environment:
      <<: *infra-urls
      # Media worker needs only Redis + storage: no Postgres credentials.
      DB_ROLE: none
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      MEDIA_TMP_DIR: /tmp/work
    secrets: [redis_password, minio_app_password]
    volumes: [*secrets-shim]
    entrypoint: ['/usr/bin/tini', '--', '/bin/sh', '/opt/with-secrets.sh']
    command: ['node', 'dist/index.js']
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # FFmpeg sandbox (docs/12-security, upload-media-security §5): ONLY on the
    # internal `media-internal` network (redis + minio, no egress / no default
    # route), non-root, read-only root FS, tmpfs temp disk, no capabilities, no
    # privilege escalation, CPU/memory/PID caps.
    networks: [media-internal]
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      # Sized for the 2 GB source cap (upload-media-security) plus the
      # normalised audio output and ffmpeg scratch: 2 GB source + up to 1 GB
      # derived files. tmpfs pages are charged to the container memory cgroup,
      # so mem_limit = 3g tmpfs + ~1g for node/ffmpeg. See docs/13-ops/containers-and-ci.md.
      - /tmp/work:size=3g,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2

  # Socket.IO gateway (apps/realtime, PR #16). Behind the `realtime` profile until
  # PR #16 merges (the build fails without apps/realtime); then drop `profiles`.
  #   ... -f infra/compose/compose.app.yml --profile realtime up -d --build
  realtime:
    profiles: ['realtime']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.realtime
    image: meetops/realtime:local
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      DB_ROLE: none
      REDIS_URL: ''
      DATABASE_URL: ''
      MIGRATION_DATABASE_URL: ''
      POSTGRES_PASSWORD: ''
      MEETOPS_APP_DB_PASSWORD: ''
      MEETOPS_MIGRATOR_DB_PASSWORD: ''
      REDIS_PASSWORD: ''
      STORAGE_SECRET_ACCESS_KEY: ''
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 4001
      # Explicit allowlist, required; never '*'.
      REALTIME_CORS_ORIGINS: ${REALTIME_CORS_ORIGINS:?set REALTIME_CORS_ORIGINS in .env}
    secrets: [redis_password]
    volumes: [*secrets-shim]
    entrypoint: ['/bin/sh', '/opt/with-secrets.sh']
    command: ['node', 'dist/index.js']
    ports:
      - '127.0.0.1:${REALTIME_PORT:-4001}:4001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    # Same hardening as the worker.
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: meetops/web:local
    restart: unless-stopped
    environment:
      CSP_API_ORIGIN: ${VITE_API_URL:-http://localhost:3000}
      CSP_REALTIME_ORIGIN: ws://localhost:${REALTIME_PORT:-4001} http://localhost:${REALTIME_PORT:-4001}
      CSP_STORAGE_ORIGIN: http://localhost:${MINIO_API_PORT:-9000}
    # WEB_APP_PORT is the containerised nginx; WEB_PORT (5173) stays for `vite dev`.
    ports:
      - '127.0.0.1:${WEB_APP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_started
