# MeetOps AI — local development infrastructure.
# Usage (from repo root): pnpm dev:infra:up   (reads ./.env, copy from .env.example)
# Optional profiles:      docker compose --env-file .env -f infra/compose/compose.dev.yml --profile ollama --profile local-stt up -d
name: meetops-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meetops}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # minio/minio and minio/mc are no longer pullable anonymously (removed from Docker Hub, quay.io needs auth).
  # Chainguard's public MinIO build (cgr.dev/chainguard/minio:latest), pinned by index digest.
  # It is distroless (no shell/mc/curl), so readiness is checked by minio-init instead of a healthcheck.
  minio:
    image: cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    restart: unless-stopped
    # Image defaults to uid 65532; run as root like the old official image so existing minio-data volumes stay writable.
    user: '0:0'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # Bucket init with the AWS CLI (amazon/aws-cli:2.38.5, pinned by index digest). Waits for MinIO, then creates the bucket.
  minio-init:
    image: amazon/aws-cli@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      STORAGE_BUCKET: ${STORAGE_BUCKET:-meetops-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ep=http://minio:9000
        i=0
        until aws --endpoint-url "$$ep" s3api list-buckets >/dev/null 2>&1; do
          i=$$((i+1)); [ "$$i" -ge 60 ] && echo "minio not ready" && exit 1
          sleep 2
        done
        aws --endpoint-url "$$ep" s3api head-bucket --bucket "$${STORAGE_BUCKET}" 2>/dev/null \
          || aws --endpoint-url "$$ep" s3api create-bucket --bucket "$${STORAGE_BUCKET}"
        echo "bucket $${STORAGE_BUCKET} ready"
    restart: 'no'

  ollama:
    image: ollama/ollama:latest
    profiles: ['ollama']
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10

  # faster-whisper OpenAI-compatible server (Speaches, formerly fedirz/faster-whisper-server).
  # CPU image; listens on 8000 inside the container, exposed on 8001 to match LOCAL_STT_URL.
  local-stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ['local-stt']
    restart: unless-stopped
    ports:
      - '8001:8000'
    volumes:
      - local-stt-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
  local-stt-cache:
