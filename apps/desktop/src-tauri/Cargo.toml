[package]
name = "meetops-desktop"
version = "0.0.0"
description = "MeetOps AI desktop app (Tauri 2)"
authors = ["MeetOps AI"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "meetops_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
