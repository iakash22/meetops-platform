[package]
name = "meetops-desktop"
version = "0.0.0"
description = "MeetOps AI desktop app (Tauri 2)"
authors = ["MeetOps AI"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "meetops_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls only (no native-tls/OpenSSL); JSON bodies.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio = { version = "1", features = ["sync"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
